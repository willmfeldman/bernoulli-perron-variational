name = "perron_variational"
version = "0.2.0"
description = "Lean 4 formalization of 'Variational properties of Perron's extremal solutions in the Bernoulli one-phase problem' (Abedin, Feldman, Stinson)"
keywords = ["math"]
defaultTargets = ["PerronVariational"]
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "viscosity_solns"
git = "https://github.com/willmfeldman/viscosity-solution-theory"
rev = "v0.4.0"

[[require]]
name = "parabolic_basic_theory"
git = "https://github.com/willmfeldman/parabolic-basic-theory"
rev = "v0.3.0"

[[require]]
name = "bernoulli_parabolic_comparison"
git = "https://github.com/willmfeldman/bernoulli-parabolic-comparison"
rev = "v0.3.0"

[[require]]
name = "elliptic_bernoulli_foundations"
git = "https://github.com/willmfeldman/elliptic-bernoulli-foundations"
rev = "v0.3.0"

[[require]]
name = "gmt_foundations"
git = "https://github.com/willmfeldman/gmt-foundations"
rev = "v0.3.0"

[[lean_lib]]
name = "PerronVariational"

[[require]]
name = "inner_variational"
git = "https://github.com/willmfeldman/bernoulli-rectifiability"
rev = "v0.4.0"
