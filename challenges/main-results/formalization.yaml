# Entry metadata for the `main-results` workspace (format: mathlib-initiative formalization.yaml v0.4).
# The root formalization.yaml keeps its own schema for the repository's checkers.
# Keep comments outside block scalars (`>-`); anything inside one becomes public text.

version: v0.4

project:
  name: "Perron's extremal solutions of the Bernoulli one-phase problem: viscosity, inner variational and one-sided minimizing solutions, and free boundary structure in the plane"
  description: >-
    A Lean 4 formalization of the main results of Abedin, Feldman and
    Stinson on Perron's extremal solutions of the one-phase Bernoulli free
    boundary problem Δu = 0 in {u > 0} ∩ U, |∇u| = Q on ∂{u > 0} ∩ U.
    Let U ⊂ ℝᵈ, d ≥ 2, be open, bounded and connected with C² boundary, and
    let Q be Lipschitz on the closure of U with 0 < Q_min ≤ Q ≤ Q_max.
    Theorem 1.1: the smallest supersolution above a smooth strict
    subsolution g with g > 0 on ∂U is (i) a viscosity solution in U, (ii)
    an inner variational solution in U for some χ (the first domain
    variation of the Alt–Caffarelli energy ∫ |∇u|² + Q² χ vanishes), and
    (iii) a downward minimizer of that energy on a ball around each free
    boundary point; the largest subsolution below a smooth strict
    supersolution g has the same three properties, with upward minimality
    in (iii). Corollary 1.2, in ℝ²: (i) the free boundary of the smallest
    supersolution is the disjoint union of a relatively open set, near each
    point of which u is a classical solution (a C^{1,γ} free boundary, u
    harmonic in {u > 0}, ∇u continuous up to the free boundary with
    |∇u| = Q there), and a set at each point x₀ of which every blow-up limit
    of u is the two-plane function Q(x₀)|y · e| for some unit vector e; (ii)
    the largest subsolution is a classical solution near every free
    boundary point. Every notion, including viscosity solutions, smooth
    strict sub- and supersolutions, Perron's classes, inner variational
    solutions, Sobolev functions, the one-sided minimizers, blow-up limits
    and classical solutions, is written out from Mathlib definitions. A
    fifth statement is the necklace example, a rigorous version, with
    different parameters, of the numerical example in Figure 1 of the
    paper: in ℝ² with Q ≡ 1 there are a domain and data, with the same
    boundary values for both problems, whose smallest supersolution and
    largest subsolution are both nontrivial and differ on a set of positive
    measure, the smallest supersolution has a two-plane point, and a
    minimizer of the Alt–Caffarelli energy with the same boundary data
    exists and differs from both extremal solutions on sets of positive
    measure. It also shows that the hypotheses of the other statements can
    be met and that their conclusions are not degenerate.
  authors: ["William M. Feldman"]
  responsible_maintainers: ["William M. Feldman"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35R35", "35D40", "49Q10", "35J25", "35B65"]

sources:
  - title: "Variational properties of Perron's extremal solutions in the Bernoulli one-phase problem"
    authors: ["Farhan Abedin", "William M. Feldman", "Kerrek Stinson"]
    type: paper
    id: "arXiv:2609.14981"
    location: "Theorem 1.1, both cases, and Corollary 1.2 (i) and (ii) (arXiv:2609.14981v2)"
    relationship: formalizes
    note: >-
      Formalizes Theorem 1.1 (i)–(iii) of arXiv version 2, both cases, and
      Corollary 1.2 (i) and (ii), with the notion of classical solution of
      its footnote, under the standing assumptions of its Section 1, with
      the definitions of its Section 2 (Definitions 2.1, 2.3, 2.11 and 2.15
      and the Perron classes (2.1)–(2.4)). The necklace example makes the
      numerical example of Figure 1 rigorous, with different parameters (100
      holes instead of 18, and an outer circle). The differences are listed
      under fidelity.

automation:
  methods:
    - method: agent
      models: ["Claude Opus"]
      framework: "Claude Code"
  notes: >-
    The Lean proofs were written by AI coding agents (Claude, by Anthropic)
    under the author's mathematical direction and review. The theorem
    statements, definitions and proof routes were reviewed by the author;
    correctness rests on Lean's kernel check and the comparator challenges.

review:
  status: "author-verified"
  notes: >-
    The author, a co-author of the paper, reviewed the definitions and the
    statements of the compared theorems against arXiv:2609.14981v1,
    including every difference recorded under fidelity, and the proof
    routes against the paper. The proofs are checked by Lean's kernel and
    by the comparator challenges in the repository.

fidelity:
  divergences: >-
    The C² boundary of U is encoded by a global C² defining function (U =
    {ρ < 0} with ∇ρ ≠ 0 on ∂U). Test functions in the viscosity
    definitions are smooth on ℝᵈ rather than on U, which is equivalent
    because the conditions are local; the data g are C² on ℝᵈ rather than
    on the closure of U, and a C² function there extends. In the inner
    variation identity the derivatives are pointwise ones, which agree
    almost everywhere with the weak derivatives for the Lipschitz functions
    involved. Sobolev functions carry their weak gradient as explicit data,
    and the energy is an extended-nonnegative lower integral, so that no
    integrability side conditions are needed. In the definition of one-sided
    minimizers, u − v ∈ H¹₀(B) is written as v = u almost everywhere off the ball B, and
    downward competitors satisfy v ≤ u instead of 0 ≤ v ≤ u (equivalent,
    since v₊ is also a competitor). The data class is larger than the
    paper's strict sub/supersolutions: condition (i) is Δg ≥ 0 (resp. Δg ≤ 0) instead
    of Δg ≥ δ₀ (resp. Δg ≤ −δ₀), and a₀, δ₀ need not be at most 1/2, so
    harmonic data are allowed and the claims strengthen Theorem 1.1 and
    Corollary 1.2. "Locally around each free boundary point" in Theorem 1.1
    (iii) is stated as: each free boundary point x has a ball B_r(x) with
    closure in U on which u is a minimizer. In Corollary 1.2, a classical
    solution near x₀ is made explicit: on some ball B_r(x₀) ⊂ U the free
    boundary is the graph of a C¹ function with γ-Hölder derivative,
    0 < γ ≤ 1, over a line, u is C² and harmonic in {u > 0}, and ∇u extends
    continuously to the closure of {u > 0} in the ball with |∇u| = Q on the
    free boundary. Blow-up limits are locally uniform limits of
    r⁻¹u(x₀ + r y) along sequences r → 0⁺, and the two-plane function is
    written in the blow-up variable y (the paper writes Q(x₀)|(x − x₀) · e|).
    Relative openness of the regular part is stated as its being the
    intersection of an open set with the free boundary, and Corollary 1.2
    (ii) is stated as classical near every free boundary point. The full
    list of differences from the paper is in DEVIATIONS.md. In the necklace
    example, H¹₀(U) is encoded as the functions whose extension by zero is
    in H¹(ℝ²), which is the usual space for C² domains, "differ" means on a
    set of positive measure, and the parameters differ from those of
    Figure 1.

