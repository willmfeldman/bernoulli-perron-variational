# Entry metadata for the `main-theorem` workspace (format: mathlib-initiative formalization.yaml v0.4).
# The root formalization.yaml keeps its own schema for the repository's checkers.
# Keep comments outside block scalars (`>-`); anything inside one becomes public text.

version: v0.4

project:
  name: "Perron's extremal solutions of the Bernoulli one-phase problem are viscosity, inner variational and one-sided minimizing solutions"
  description: >-
    A Lean 4 formalization of the main theorem of Abedin, Feldman and
    Stinson on Perron's extremal solutions of the one-phase Bernoulli free
    boundary problem Δu = 0 in {u > 0} ∩ U, |∇u| = Q on ∂{u > 0} ∩ U.
    Let U ⊂ ℝᵈ, d ≥ 2, be open, bounded and connected with C² boundary, and
    let Q be Lipschitz on the closure of U with 0 < Q_min ≤ Q ≤ Q_max. The
    smallest supersolution above a smooth strict subsolution g with g > 0
    on ∂U is (i) a viscosity solution in U, (ii) an inner variational
    solution in U for some χ (the first domain variation of the
    Alt–Caffarelli energy ∫ |∇u|² + Q² χ vanishes), and (iii) a downward
    minimizer of that energy on a ball around each free boundary point.
    The largest subsolution below a smooth strict supersolution g has the
    same three properties, with upward minimality in (iii). Every notion,
    including viscosity solutions, smooth strict sub- and supersolutions,
    Perron's classes, inner variational solutions, Sobolev functions and
    the one-sided minimizers, is written out from Mathlib definitions. A
    third statement is a non-vacuity check, not a theorem of the paper: in
    ℝ² with Q ≡ 1 there are a domain and data, with the same boundary
    values for both problems, whose smallest supersolution and largest
    subsolution are both nontrivial, with nonempty free boundaries, and
    differ, and the origin is a two-plane point of the smallest
    supersolution.
  authors: ["William M. Feldman"]
  responsible_maintainers: ["William M. Feldman"]
  license: "Apache-2.0"

