fidelity:
  divergences: >-
    The C² boundary of U is encoded by a global C² defining function (U =
    {ρ < 0} with ∇ρ ≠ 0 on ∂U). Test functions in the viscosity
    definitions are smooth on ℝᵈ rather than on U, which is equivalent
    because the conditions are local; the data g are C² on ℝᵈ rather than
    on the closure of U, and a C² function there extends. In the inner
    variation identity the derivatives are pointwise ones, which agree
    almost everywhere with the weak derivatives for the Lipschitz functions
    involved. Sobolev functions carry their weak gradient as explicit data,
    and the energy is an extended-nonnegative lower integral, so that no
    integrability side conditions are needed. In Definition 2.11 the paper
    takes u, v ∈ H¹(U) and compares the energies on U; here u, v ∈ H¹_loc(U)
    and the energies are compared on the ball B where u and v differ, and
    u − v ∈ H¹₀(B) is written as v = u almost everywhere off B. The two forms
    agree when the energy of u on U is finite, which holds on the balls of
    (iii). "Locally around each free boundary point" in (iii) is stated as:
    each free boundary point x has a ball B_r(x) with closure in U on which
    u is a minimizer. Two intermediate results used in the proof are
    corrected relative to arXiv version 1: Proposition 5.3 and Corollary
    5.4 are stated for the authors' corrected set E*; the statement of
    Theorem 1.1 is unaffected. The non-vacuity check is not a result of the
    paper.

