      models: ["Claude Opus"]
      framework: "Claude Code"
  notes: >-
    The Lean proofs were written by AI coding agents (Claude, by Anthropic)
    under the author's mathematical direction and review. The theorem
    statements, definitions and proof routes were reviewed by the author;
    correctness rests on Lean's kernel check and the comparator challenges.

review:
  status: "author-verified"
  notes: >-
    The author, a co-author of the paper, reviewed the definitions and the
    statements of the compared theorems against arXiv:2609.14981v1,
    including every difference recorded under fidelity, and the proof
    routes against the paper. The proofs are checked by Lean's kernel and
    by the comparator challenges in the repository.

fidelity:
  divergences: >-
    The C² boundary of U is encoded by a global C² defining function (U =
    {ρ < 0} with ∇ρ ≠ 0 on ∂U). Test functions in the viscosity
    definitions are smooth on ℝ² rather than on U, which is equivalent
    because the conditions are local; the data g are C² on ℝ² rather than
    on the closure of U, and a C² function there extends. A classical
    solution near x₀ is made explicit: on some ball B_r(x₀) ⊂ U the free
    boundary is the graph of a C¹ function with γ-Hölder derivative,
    0 < γ ≤ 1, over a line, u is C² and harmonic in {u > 0}, and ∇u extends
    continuously to the closure of {u > 0} in the ball with |∇u| = Q on the
    free boundary. Blow-up limits are locally uniform limits of
    r⁻¹u(x₀ + r y) along sequences r → 0⁺, and the two-plane function is
    written in the blow-up variable y (the paper writes Q(x₀)|(x − x₀) · e|).
    Relative openness of the regular part is stated as its being the
    intersection of an open set with the free boundary, and (ii) is stated
    as classical near every free boundary point. Two intermediate results
    used in the proof are corrected relative to arXiv version 1:
    Proposition 5.3 and Corollary 5.4 are stated for the authors' corrected
    set E*; the statement of Corollary 1.2 is unaffected. The non-vacuity
    check is not a result of the paper.

