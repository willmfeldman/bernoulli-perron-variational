# Entry metadata for the `planar-structure` workspace (format: mathlib-initiative formalization.yaml v0.4).
# The root formalization.yaml keeps its own schema for the repository's checkers.
# Keep comments outside block scalars (`>-`); anything inside one becomes public text.

version: v0.4

project:
  name: "Free boundary structure of Perron's extremal solutions of the Bernoulli one-phase problem in the plane"
  description: >-
    A Lean 4 formalization of the planar corollary of Abedin, Feldman and
    Stinson on Perron's extremal solutions of the one-phase Bernoulli free
    boundary problem Δu = 0 in {u > 0} ∩ U, |∇u| = Q on ∂{u > 0} ∩ U. Let
    U ⊂ ℝ² be open, bounded and connected with C² boundary, and let Q be
    Lipschitz on the closure of U with 0 < Q_min ≤ Q ≤ Q_max. (i) For the
    smallest supersolution u above a smooth strict subsolution g with g > 0
    on ∂U, the free boundary ∂{u > 0} ∩ U is the disjoint union of a
    relatively open set, near each point of which u is a classical
    solution (a C^{1,γ} free boundary, u harmonic in {u > 0}, ∇u continuous
    up to the free boundary with |∇u| = Q there), and a set at each point
    x₀ of which every blow-up limit of u is the two-plane function
    Q(x₀)|y · e| for some unit vector e. (ii) The largest subsolution below a
    smooth strict supersolution is a classical solution near every free
    boundary point. Every notion, including viscosity super- and
    subsolutions, smooth strict sub- and supersolutions, Perron's classes,
    blow-up limits and classical solutions, is written out from Mathlib
    definitions. A third statement is a non-vacuity check, not a theorem
    of the paper: in ℝ² with Q ≡ 1 there are a domain and data, with the
    same boundary values for both problems, whose smallest supersolution
    and largest subsolution are both nontrivial, with nonempty free
    boundaries, and differ, and the origin is a two-plane point of the
    smallest supersolution, so the second alternative of (i) occurs.
  authors: ["William M. Feldman"]
  responsible_maintainers: ["William M. Feldman"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35R35", "35B65", "35D40", "35J25"]

sources:
  - title: "Variational properties of Perron's extremal solutions in the Bernoulli one-phase problem"
    authors: ["Farhan Abedin", "William M. Feldman", "Kerrek Stinson"]
    type: paper
    id: "arXiv:2609.14981"
    location: "Corollary 1.2 (i) and (ii) (arXiv:2609.14981v1)"
    relationship: formalizes
    note: >-
      Formalizes Corollary 1.2 (i) and (ii) of arXiv version 1, with the
      notion of classical solution of its footnote, under the standing
      assumptions of its Section 1 and the definitions of its Section 2.
      The non-vacuity check is not in the paper. The differences are
      listed under fidelity.

related_formalizations: []

automation:
